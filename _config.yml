title: "科技前沿"
description: "AI · 编程 · 大模型 · 科技趋势 — 日更深度内容"
language: zh-CN
url: "https://wdsega.github.io"
baseurl: ""
author:
  name: WDSEGA
  email: ""

future: true
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
