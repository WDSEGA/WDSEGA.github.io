<!DOCTYPE html>
<html lang="{{ site.language | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Google Analytics -->
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}

  <!-- Google AdSense (head) -->
  {% if site.google_adsense %}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.google_adsense }}" crossorigin="anonymous"></script>
  {% endif %}

  <!-- PropellerAds MultiTag -->
  <script src="https://quge5.com/88/tag.min.js" data-zone="239936" async data-cfasync="false"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
      color: #333;
      background: #fafafa;
    }
    a { color: #2563eb; text-decoration: none; transition: color 0.2s; }
    a:hover { color: #1d4ed8; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 20px 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .container { display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.4rem; font-weight: 700; color: #111; }
    header nav a { margin-left: 20px; color: #555; font-size: 0.95rem; }
    header nav a:hover { color: #2563eb; }
    main { padding: 40px 0; }
    .post-list { list-style: none; }
    .post-list li {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 16px;
      transition: box-shadow 0.2s;
    }
    .post-list li:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .post-list .post-date { font-size: 0.85rem; color: #888; margin-bottom: 6px; }
    .post-list .post-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
    .post-list .post-title a { color: #111; }
    .post-list .post-title a:hover { color: #2563eb; }
    .post-list .post-excerpt { color: #555; font-size: 0.95rem; }
    .post-content {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 32px;
      margin-bottom: 24px;
    }
    .post-content h1, .post-content h2, .post-content h3 { margin: 1.5em 0 0.5em; color: #111; }
    .post-content h2 { font-size: 1.4rem; }
    .post-content h3 { font-size: 1.15rem; }
    .post-content p { margin-bottom: 1em; }
    .post-content ul, .post-content ol { margin: 1em 0; padding-left: 2em; }
    .post-content li { margin-bottom: 0.5em; }
    .post-content code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .post-content pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1em 0;
    }
    .post-content pre code { background: none; padding: 0; color: inherit; }
    .post-content blockquote {
      border-left: 4px solid #2563eb;
      padding: 8px 16px;
      margin: 1em 0;
      color: #555;
      background: #f8fafc;
      border-radius: 0 4px 4px 0;
    }
    .post-meta { font-size: 0.9rem; color: #888; margin-bottom: 24px; }
    .ad-slot {
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      text-align: center;
      padding: 16px;
      margin: 24px 0;
      border-radius: 4px;
      color: #9ca3af;
      font-size: 0.85rem;
    }
    footer {
      text-align: center;
      padding: 24px 0;
      color: #888;
      font-size: 0.85rem;
      border-top: 1px solid #e5e7eb;
      margin-top: 40px;
    }
    @media (max-width: 640px) {
      header .container { flex-direction: column; gap: 12px; }
      header nav a { margin-left: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="{{ '/' | absolute_url }}">{{ site.title }}</a></h1>
      <nav>
        <a href="{{ '/' | absolute_url }}">首页</a>
        <a href="{{ '/about.html' | absolute_url }}">关于</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer>
    <div class="container">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
