<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{% if page.canonical_url %}{{ page.canonical_url }}{% else %}{{ page.url | absolute_url }}{% endif %}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{ site.google_analytics }}');</script>
  {% endif %}
  {% if site.google_adsense %}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.google_adsense }}" crossorigin="anonymous"></script>
  {% endif %}

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | absolute_url }}">

<body>
  <div class="progress-bar" id="progressBar"></div>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a href="{{ '/' | absolute_url }}" class="site-logo">
        <span class="logo-icon">&lt;/&gt;</span>
        <span class="logo-text">{{ site.title }}</span>
      </a>
      <nav class="site-nav" id="siteNav">
        <a href="{{ '/' | absolute_url }}" {% if page.url == '/' %}class="active"{% endif %}>首页</a>
        <a href="{{ '/tags.html' | absolute_url }}" {% if page.url == '/tags.html' %}class="active"{% endif %}>标签</a>
        <a href="{{ '/search.html' | absolute_url }}" {% if page.url == '/search.html' %}class="active"{% endif %}>搜索</a>
        <a href="{{ '/about.html' | absolute_url }}" {% if page.url == '/about.html' %}class="active"{% endif %}>关于</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换暗色模式" title="切换暗色模式">
          <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main class="main-content">{{ content }}</main>

  <div style="text-align:center;padding:20px 0;margin-top:30px;">
    <script>(function(rdtf){var d=document,s=d.createElement('script'),l=d.scripts[d.scripts.length-1];s.settings=rdtf||{};s.src="\/\/quarrelsomebitter.com\/b-XeVXs.dgG\/lP0\/YSWccW\/qeim\/9\/u\/ZXUQlbkVPTTDcjwrNTTHI\/4vMBD-UptSNGziAH1\/MOj\/gEwHOvQP";s.async=true;s.referrerPolicy='no-referrer-when-downgrade';l.parentNode.insertBefore(s,l);})({})</script>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-logo">&lt;/&gt; {{ site.title }}</span>
        <p>专注 AI、编程与技术前沿。日更科技内容。</p>
      </div>
      <div class="footer-links">
        <a href="{{ '/' | absolute_url }}">首页</a>
        <a href="{{ '/tags.html' | absolute_url }}">标签</a>
        <a href="{{ '/search.html' | absolute_url }}">搜索</a>
        <a href="{{ '/feed.xml' | absolute_url }}">RSS</a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}. Powered by Jekyll & GitHub Pages.</p>
    </div>
  </footer>

  <button class="scroll-top" id="scrollTop" aria-label="返回顶部" title="返回顶部">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <script src="{{ '/assets/js/main.js' | absolute_url }}"></script>
</body>
</html>
