---
layout: default
title: "首页"
---

<h2 style="margin-bottom: 24px; color: #111;">最新文章</h2>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <div class="post-date">{{ post.date | date: "%Y-%m-%d" }}</div>
      <div class="post-title"><a href="{{ post.url | absolute_url }}">{{ post.title }}</a></div>
      <div class="post-excerpt">{{ post.excerpt | strip_html | truncate: 120 }}</div>
    </li>
  {% endfor %}
</ul>

{% if site.posts.size == 0 %}
  <p style="color: #888; text-align: center; padding: 40px 0;">暂无文章，敬请期待。</p>
{% endif %}
