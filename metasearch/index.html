<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaSearch - 多源聚合搜索 | BT磁力 + 网盘 + 图片 + 文档</title>
<meta name="description" content="MetaSearch 免费多源聚合搜索引擎，支持BT磁力搜索、网盘资源搜索（百度/阿里/夸克/蓝奏）、图片搜索（芝加哥美术馆API）和文档搜索（Bing RSS）。">
<meta name="keywords" content="磁力搜索,BT搜索,网盘搜索,图片搜索,文档搜索,聚合搜索,元搜索,种子搜索,百度网盘搜索">
<meta name="author" content="Deskless Daily">
<meta name="robots" content="index, follow">
<meta property="og:title" content="MetaSearch - 多源聚合搜索引擎">
<meta property="og:description" content="免费多源聚合搜索 - BT磁力 + 网盘资源 + 图片搜索 + 文档搜索">
<meta property="og:type" content="website">
<style>
:root {
  --bg: #0f0f14;
  --bg-card: #1a1a24;
  --bg-input: #12121a;
  --border: #2a2a3a;
  --text: #e0e0e8;
  --text-dim: #8888a0;
  --accent: #6c5ce7;
  --accent2: #00cec9;
  --red: #ff6b6b;
  --green: #51cf66;
  --orange: #ffa502;
  --blue: #54a0ff;
  --purple: #a29bfe;
  --radius: 10px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
}

.container { max-width: 1100px; margin: 0 auto; padding: 16px 20px; }

header { text-align: center; padding: 28px 0 8px; }
header h1 { font-size: 28px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
header p { color: var(--text-dim); font-size: 13px; margin-top: 6px; }

/* Backend status */
.backend-bar {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 16px; margin: 0 auto 12px; border-radius: 20px;
  font-size: 12px; max-width: 420px;
}
.backend-bar.online { background: rgba(81,207,102,0.12); color: var(--green); }
.backend-bar.offline { background: rgba(255,107,107,0.12); color: var(--red); }
.backend-bar .dot { width: 8px; height: 8px; border-radius: 50%; }
.backend-bar.online .dot { background: var(--green); animation: pulse 2s infinite; }
.backend-bar.offline .dot { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--border); padding-bottom: 0; overflow-x: auto; }
.tab {
  padding: 10px 18px; cursor: pointer; border-radius: 8px 8px 0 0;
  font-size: 14px; color: var(--text-dim); transition: all 0.2s;
  white-space: nowrap; border: 1px solid transparent; border-bottom: none;
  position: relative; top: 2px;
}
.tab:hover { color: var(--text); background: rgba(108,92,231,0.08); }
.tab.active { color: var(--accent); background: var(--bg-card); border-color: var(--border); }
.tab.active::after { content:''; position:absolute; bottom:-2px; left:0; right:0; height:2px; background:var(--bg-card); }
.tab-icon { margin-right: 4px; }

/* Search bar */
.search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
.search-bar input {
  flex:1; padding: 12px 18px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--bg-input); color: var(--text); font-size: 15px; outline: none;
  transition: border-color 0.2s;
}
.search-bar input:focus { border-color: var(--accent); }
.search-bar button {
  padding: 12px 24px; border-radius: var(--radius); border: none;
  background: linear-gradient(135deg, var(--accent), #5a4bd1);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: opacity 0.2s; white-space: nowrap;
}
.search-bar button:hover { opacity: 0.9; }
.search-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

/* Stats */
.stats { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; min-height: 20px; }

/* Offline notice for non-image tabs */
.offline-notice {
  background: var(--bg-card); border: 1px dashed var(--border); border-radius: var(--radius);
  padding: 32px 24px; text-align: center; margin: 20px 0;
}
.offline-notice h3 { color: var(--orange); margin-bottom: 10px; font-size: 16px; }
.offline-notice p { color: var(--text-dim); font-size: 13px; line-height: 1.7; }
.offline-notice code { background: var(--bg-input); padding: 2px 6px; border-radius: 4px; font-size: 12px; color: var(--accent2); }

/* Result cards */
.results { display: flex; flex-direction: column; gap: 10px; }
.result-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; transition: border-color 0.2s;
}
.result-card:hover { border-color: var(--accent); }

.result-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.result-title a { color: var(--text); text-decoration: none; }
.result-title a:hover { color: var(--accent2); text-decoration: underline; }

.result-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
.result-meta .source { background: rgba(108,92,231,0.15); color: var(--purple); padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.result-meta .seed { color: var(--green); }
.result-meta .size { color: var(--text-dim); }
.result-meta .pan-type { background: rgba(0,206,201,0.15); color: var(--accent2); padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.result-meta .file-type { background: rgba(255,165,2,0.15); color: var(--orange); padding: 2px 8px; border-radius: 10px; font-size: 11px; }

.result-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.btn {
  padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px;
  cursor: pointer; text-decoration: none; transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 4px;
}
.btn-copy { background: rgba(108,92,231,0.1); color: var(--purple); border-color: rgba(108,92,231,0.3); }
.btn-copy:hover { background: rgba(108,92,231,0.2); }
.btn-visit { background: rgba(0,206,201,0.1); color: var(--accent2); border-color: rgba(0,206,201,0.3); }
.btn-visit:hover { background: rgba(0,206,201,0.2); }
.btn-dl { background: rgba(81,207,102,0.1); color: var(--green); border-color: rgba(81,207,102,0.3); }
.btn-dl:hover { background: rgba(81,207,102,0.2); }
.copied { animation: copy-flash 0.4s ease; }
@keyframes copy-flash { 50% { background: rgba(81,207,102,0.3); } }

.result-snippet { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-top: 6px; }

/* Image grid */
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.image-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s;
  position: relative;
}
.image-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.image-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
.image-card .img-info { padding: 8px 10px; }
.image-card .img-title { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.image-card .img-source { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.image-card .img-actions { display: flex; gap: 4px; padding: 0 8px 8px; }
.image-card .img-actions .btn { padding: 3px 8px; font-size: 10px; flex: 1; text-align: center; }

/* Lightbox */
.lightbox {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
  z-index: 1000; align-items: center; justify-content: center; flex-direction: column;
}
.lightbox.active { display: flex; }
.lightbox img { max-width: 90vw; max-height: 80vh; border-radius: 8px; }
.lightbox .lb-close {
  position: absolute; top: 20px; right: 24px; font-size: 32px; color: #fff;
  cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center;
  justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.1);
}
.lightbox .lb-dl { margin-top: 16px; padding: 10px 24px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text-dim); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Source hint */
.source-hint {
  margin-top: 24px; padding: 12px 16px; background: var(--bg-card); border-radius: var(--radius);
  border: 1px solid var(--border); font-size: 11px; color: var(--text-dim);
  display: flex; flex-wrap: wrap; gap: 12px;
}
.source-hint span { white-space: nowrap; }

/* Footer */
footer { text-align: center; padding: 24px; color: var(--text-dim); font-size: 11px; }
footer a { color: var(--purple); text-decoration: none; }
footer a:hover { text-decoration: underline; }

/* Responsive */
@media (max-width: 600px) {
  .tabs { gap: 2px; }
  .tab { padding: 8px 10px; font-size: 12px; }
  .image-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>MetaSearch</h1>
    <p>多源聚合搜索 &middot; BT磁力 + 网盘资源 + 图片搜索 + 文档搜索</p>
  </header>

  <div class="backend-bar offline" id="backendBar">
    <span class="dot"></span>
    <span id="backendText">检测后端服务...</span>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="torrent"><span class="tab-icon">🧲</span>BT磁力</div>
    <div class="tab" data-tab="pan"><span class="tab-icon">☁️</span>网盘资源</div>
    <div class="tab" data-tab="image"><span class="tab-icon">🖼️</span>图片搜索</div>
    <div class="tab" data-tab="doc"><span class="tab-icon">📄</span>文档搜索</div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="输入关键词搜索..." onkeydown="if(event.key==='Enter')doSearch()">
    <button id="searchBtn" onclick="doSearch()">🔍 搜索</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="results" id="results"></div>

  <div class="source-hint" id="sourceHint">
    <span>🖼️ 图片: 芝加哥艺术博物馆 API（线上可用）</span>
    <span>🧲☁️📄 其他: 需启动本地后端服务获取全功能</span>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lb-close">&times;</span>
  <img id="lbImg" src="" alt="">
  <button class="lb-dl" id="lbDl" onclick="event.stopPropagation();downloadLightbox()">💾 下载原图</button>
</div>

<footer>
  <a href="https://wdsega.github.io">&larr; 返回无人日报</a>
</footer>

<script>
// ── State ──
let currentTab = 'torrent';
let backendOnline = false;
let backendChecked = false;

// ── Init ──
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

checkBackend();

async function checkBackend() {
  const bar = document.getElementById('backendBar');
  const text = document.getElementById('backendText');
  try {
    const resp = await fetch('/api/health', { signal: AbortSignal.timeout(2000) });
    if (resp.ok) {
      backendOnline = true;
      bar.className = 'backend-bar online';
      text.textContent = '本地后端已连接 - 全功能模式';
    } else {
      markOffline();
    }
  } catch (e) {
    markOffline();
  }
  backendChecked = true;
  updateSourceHint();
}

function markOffline() {
  backendOnline = false;
  const bar = document.getElementById('backendBar');
  const text = document.getElementById('backendText');
  bar.className = 'backend-bar offline';
  text.textContent = '离线模式 - 仅图片搜索可用（芝加哥美术馆）';
}

function updateSourceHint() {
  const el = document.getElementById('sourceHint');
  if (backendOnline) {
    el.innerHTML = '<span>🧲 BT: 1377x.to + SpeedTorrent</span><span>☁️ 网盘: 学霸盘 + 皮卡搜索 + 小云搜索 + 咔帕搜索</span><span>🖼️ 图片: Chicago Art Institute + SourceSplash + NK Images</span><span>📄 文档: Bing RSS 聚合</span>';
  }
}

// ── Tab switching ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  document.getElementById('results').innerHTML = '';
  document.getElementById('stats').textContent = '';
  updateSourceHint();
  if (!backendOnline && tab !== 'image') {
    showOfflineNotice(tab);
  }
}

function showOfflineNotice(tab) {
  const tabNames = { torrent: 'BT磁力搜索', pan: '网盘资源搜索', doc: '文档搜索' };
  const tabIcons = { torrent: '🧲', pan: '☁️', doc: '📄' };
  document.getElementById('results').innerHTML = `
    <div class="offline-notice">
      <h3>${tabIcons[tab]} ${tabNames[tab]} 需要本地后端服务</h3>
      <p>此功能依赖后端爬虫引擎，无法在纯浏览器端运行。</p>
      <p style="margin-top:12px">请先启动本地后端：</p>
      <p><code>cd metasearch && python backend.py</code></p>
      <p style="margin-top:8px">然后访问 <code>http://localhost:8787</code> 即可使用完整功能。</p>
      <p style="margin-top:12px">切换到 <strong>🖼️ 图片搜索</strong> 标签即可体验在线搜索功能。</p>
    </div>
  `;
}

// ── Search ──
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;

  const resultsEl = document.getElementById('results');
  const statsEl = document.getElementById('stats');
  const btn = document.getElementById('searchBtn');

  resultsEl.innerHTML = '<div class="loading"><div class="spinner"></div>正在搜索...</div>';
  statsEl.textContent = '';
  btn.disabled = true;

  try {
    if (currentTab === 'image') {
      await searchImagesOnline(q);
    } else if (backendOnline) {
      await searchViaBackend(q, currentTab);
    } else {
      showOfflineNotice(currentTab);
    }
  } catch (e) {
    resultsEl.innerHTML = `<div class="offline-notice"><h3>搜索出错</h3><p>${e.message}</p></div>`;
  }
  btn.disabled = false;
}

// ── Backend search ──
async function searchViaBackend(q, type) {
  const endpoints = { torrent: 'torrent', pan: 'pan', image: 'image', doc: 'doc' };
  const resp = await fetch(`/api/search/${endpoints[type]}?q=${encodeURIComponent(q)}&limit=20`);
  const data = await resp.json();
  document.getElementById('stats').textContent = `共 ${data.count} 条结果，来自 ${data.sources_count || 0} 个源`;
  if (type === 'torrent') renderTorrents(data.results);
  else if (type === 'pan') renderPans(data.results);
  else if (type === 'image') renderImages(data.results);
  else if (type === 'doc') renderDocs(data.results);
}

// ── Online image search (CORS-friendly APIs) ──
async function searchImagesOnline(q) {
  const results = [];
  const sources = [];

  // Chicago Art Institute (CORS ✅, confirmed)
  try {
    const resp = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=${encodeURIComponent(q)}&limit=20&fields=id,title,image_id,artist_title,date_display`);
    const data = await resp.json();
    for (const item of (data.data || [])) {
      if (item.image_id) {
        results.push({
          title: item.title || 'Untitled',
          url: `https://www.artic.edu/iiif/2/${item.image_id}/full/843,/0/default.jpg`,
          thumb_url: `https://www.artic.edu/iiif/2/${item.image_id}/full/200,/0/default.jpg`,
          source: 'Chicago Art Institute',
          width: 843, height: 0
        });
      }
    }
    if (results.length > 0) sources.push('Chicago Art Institute');
  } catch (e) { console.log('Artic API error:', e.message); }

  // Lorem Picsum fallback (CORS ✅)
  if (results.length === 0) {
    try {
      const resp = await fetch(`https://picsum.photos/v2/list?page=1&limit=12`);
      const data = await resp.json();
      for (const item of data) {
        results.push({
          title: `Photo by ${item.author}`,
          url: item.download_url,
          thumb_url: `https://picsum.photos/id/${item.id}/200/150`,
          source: 'Lorem Picsum',
          width: item.width, height: item.height
        });
      }
      sources.push('Lorem Picsum');
    } catch (e) { console.log('Picsum error:', e.message); }
  }

  document.getElementById('stats').textContent = `共 ${results.length} 条结果（在线模式，源: ${sources.join(', ') || '无'}）`;
  renderImages(results);
}

// ── Render torrents ──
function renderTorrents(items) {
  document.getElementById('results').innerHTML = items.map(r => `
    <div class="result-card">
      <div class="result-title"><a href="${esc(r.torrent_url || '#')}" target="_blank">${esc(r.title)}</a></div>
      <div class="result-meta">
        <span class="source">${esc(r.source)}</span>
        ${r.seeds ? `<span class="seed">🔺 ${r.seeds}</span>` : ''}
        ${r.size ? `<span class="size">${esc(r.size)}</span>` : ''}
      </div>
      <div class="result-actions">
        ${r.magnet ? `<button class="btn btn-copy" onclick="copyMagnet('${escJs(r.magnet)}',this)">📋 复制磁力链接</button>` : ''}
        ${r.torrent_url ? `<a class="btn btn-visit" href="${esc(r.torrent_url)}" target="_blank">🔗 打开详情页</a>` : ''}
      </div>
    </div>
  `).join('');
}

// ── Render pans ──
function renderPans(items) {
  document.getElementById('results').innerHTML = items.map(r => `
    <div class="result-card">
      <div class="result-title"><a href="${esc(r.url || '#')}" target="_blank">${esc(r.title)}</a></div>
      <div class="result-meta">
        <span class="source">${esc(r.source)}</span>
        ${r.pan_type ? `<span class="pan-type">${esc(r.pan_type)}</span>` : ''}
        ${r.password ? `<span>🔑 ${esc(r.password)}</span>` : ''}
      </div>
      <div class="result-actions">
        <a class="btn btn-visit" href="${esc(r.url)}" target="_blank">🔗 前往下载</a>
      </div>
    </div>
  `).join('');
}

// ── Render images ──
function renderImages(items) {
  document.getElementById('results').innerHTML = `
    <div class="image-grid">
      ${items.map(r => `
        <div class="image-card">
          <img src="${esc(r.thumb_url || r.url)}" alt="${esc(r.title)}" loading="lazy"
               onclick="openLightbox('${escJs(r.url)}', '${escJs(r.title)}')"
               onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 150%22><rect fill=%22%231a1a24%22 width=%22200%22 height=%22150%22/><text fill=%22%23888%22 x=%22100%22 y=%2280%22 text-anchor=%22middle%22 font-size=%2214%22>加载失败</text></svg>'">
          <div class="img-info">
            <div class="img-title">${esc(r.title)}</div>
            <div class="img-source">${esc(r.source)}</div>
          </div>
          <div class="img-actions">
            <button class="btn btn-visit" onclick="event.stopPropagation();openLightbox('${escJs(r.url)}','${escJs(r.title)}')">🔍 预览</button>
            <button class="btn btn-dl" onclick="event.stopPropagation();downloadImage('${escJs(r.url)}','${escJs(r.title)}')">💾 保存</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// ── Render docs ──
function renderDocs(items) {
  document.getElementById('results').innerHTML = items.map(r => `
    <div class="result-card">
      <div class="result-title"><a href="${esc(r.url || '#')}" target="_blank">${esc(r.title)}</a></div>
      <div class="result-meta">
        <span class="source">${esc(r.source)}</span>
        ${r.file_type ? `<span class="file-type">${esc(r.file_type).toUpperCase()}</span>` : ''}
      </div>
      ${r.snippet ? `<div class="result-snippet">${esc(r.snippet)}</div>` : ''}
      <div class="result-actions">
        <a class="btn btn-visit" href="${esc(r.url)}" target="_blank">🔗 打开链接</a>
      </div>
    </div>
  `).join('');
}

// ── Lightbox ──
let currentLbUrl = '';
function openLightbox(url, title) {
  currentLbUrl = url;
  document.getElementById('lbImg').src = url;
  document.getElementById('lbImg').alt = title;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  currentLbUrl = '';
}
function downloadLightbox() {
  if (currentLbUrl) downloadImage(currentLbUrl, 'metasearch_image');
}
function downloadImage(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name || 'image'; a.target = '_blank';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ── Copy magnet ──
function copyMagnet(magnet, btn) {
  navigator.clipboard.writeText(magnet).then(() => {
    btn.classList.add('copied');
    btn.textContent = '✅ 已复制!';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 复制磁力链接'; }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = magnet; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.classList.add('copied'); btn.textContent = '✅ 已复制!';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 复制磁力链接'; }, 2000);
  });
}

// ── Keyboard shortcut ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); document.getElementById('searchInput').focus(); }
});

// ── Helpers ──
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escJs(s) {
  if (!s) return '';
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
}
</script>
