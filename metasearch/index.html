.container { max-width: 1100px; margin: 0 auto; padding: 16px 20px; }

header { text-align: center; padding: 28px 0 8px; }

/* Backend status */

.backend-bar .dot { width: 8px; height: 8px; border-radius: 50%; }
.backend-bar.online .dot { background: var(--green); animation: pulse 2s infinite; }
.backend-bar.offline .dot { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Offline notice for non-image tabs */

.result-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.btn {

}
.btn-copy { background: rgba(108,92,231,0.1); color: var(--purple); border-color: rgba(108,92,231,0.3); }
.btn-copy:hover { background: rgba(108,92,231,0.2); }
.btn-visit { background: rgba(0,206,201,0.1); color: var(--accent2); border-color: rgba(0,206,201,0.3); }
.btn-visit:hover { background: rgba(0,206,201,0.2); }
.btn-dl { background: rgba(81,207,102,0.1); color: var(--green); border-color: rgba(81,207,102,0.3); }

/* Image grid */
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }

/* Lightbox */
.lightbox {

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text-dim); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Source hint */
.source-hint {

}

/* Footer */

/* Responsive */

  .image-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
</style>

<script>
// 鈹€鈹€ State 鈹€鈹€
let currentTab = 'torrent';

// 鈹€鈹€ Init 鈹€鈹€
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

checkBackend();

}

  if (backendOnline) {
    el.innerHTML = '<span>馃Р BT: 1377x.to + SpeedTorrent</span><span>鈽侊笍 缃戠洏: 瀛﹂湼鐩?+ 鐨崱鎼滅储 + 灏忎簯鎼滅储 + 鍜斿笗鎼滅储</span><span>馃柤锔?鍥剧墖: Chicago Art Institute + SourceSplash + NK Images</span><span>馃搫 鏂囨。: Bing RSS 鑱氬悎</span>';
  }
}

// 鈹€鈹€ Tab switching 鈹€鈹€
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  document.getElementById('results').innerHTML = '';
  document.getElementById('stats').textContent = '';
  updateSourceHint();
  if (!backendOnline && tab !== 'image') {
    showOfflineNotice(tab);
  }
}

function showOfflineNotice(tab) {
  const tabNames = { torrent: 'BT纾佸姏鎼滅储', pan: '缃戠洏璧勬簮鎼滅储', doc: '鏂囨。鎼滅储' };
  const tabIcons = { torrent: '馃Р', pan: '鈽侊笍', doc: '馃搫' };
  document.getElementById('results').innerHTML = `
    <div class="offline-notice">
      <h3>${tabIcons[tab]} ${tabNames[tab]} 闇€瑕佹湰鍦板悗绔湇鍔?/h3>
      <p>姝ゅ姛鑳戒緷璧栧悗绔埇铏紩鎿庯紝鏃犳硶鍦ㄧ函娴忚鍣ㄧ杩愯銆?/p>
      <p style="margin-top:12px">璇峰厛鍚姩鏈湴鍚庣锛?/p>

    </div>
  `;
}

// 鈹€鈹€ Search 鈹€鈹€
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;

  const resultsEl = document.getElementById('results');
  const statsEl = document.getElementById('stats');
  const btn = document.getElementById('searchBtn');

  resultsEl.innerHTML = '<div class="loading"><div class="spinner"></div>姝ｅ湪鎼滅储...</div>';
  statsEl.textContent = '';
  btn.disabled = true;

  try {
    if (currentTab === 'image') {
      await searchImagesOnline(q);
    } else if (backendOnline) {
      await searchViaBackend(q, currentTab);
    } else {
      showOfflineNotice(currentTab);
    }
  } catch (e) {
    resultsEl.innerHTML = `<div class="offline-notice"><h3>鎼滅储鍑洪敊</h3><p>${e.message}</p></div>`;
  }
  btn.disabled = false;
}

// 鈹€鈹€ Backend search 鈹€鈹€
async function searchViaBackend(q, type) {
  const endpoints = { torrent: 'torrent', pan: 'pan', image: 'image', doc: 'doc' };
  const resp = await fetch(`/api/search/${endpoints[type]}?q=${encodeURIComponent(q)}&limit=20`);
  const data = await resp.json();
  document.getElementById('stats').textContent = `鍏?${data.count} 鏉＄粨鏋滐紝鏉ヨ嚜 ${data.sources_count || 0} 涓簮`;
  if (type === 'torrent') renderTorrents(data.results);
  else if (type === 'pan') renderPans(data.results);
  else if (type === 'image') renderImages(data.results);
  else if (type === 'doc') renderDocs(data.results);
}

// 鈹€鈹€ Online image search (CORS-friendly APIs) 鈹€鈹€
async function searchImagesOnline(q) {
  const results = [];
  const sources = [];

  // Chicago Art Institute (CORS 鉁? confirmed)
  try {
    const resp = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=${encodeURIComponent(q)}&limit=20&fields=id,title,image_id,artist_title,date_display`);
    const data = await resp.json();
    for (const item of (data.data || [])) {
      if (item.image_id) {
        results.push({
          title: item.title || 'Untitled',
          url: `https://www.artic.edu/iiif/2/${item.image_id}/full/843,/0/default.jpg`,
          thumb_url: `https://www.artic.edu/iiif/2/${item.image_id}/full/200,/0/default.jpg`,
          source: 'Chicago Art Institute',
          width: 843, height: 0
        });
      }
    }
    if (results.length > 0) sources.push('Chicago Art Institute');
  } catch (e) { console.log('Artic API error:', e.message); }

  // Lorem Picsum fallback (CORS 鉁?
  if (results.length === 0) {
    try {
      const resp = await fetch(`https://picsum.photos/v2/list?page=1&limit=12`);
      const data = await resp.json();
      for (const item of data) {
        results.push({
          title: `Photo by ${item.author}`,
          url: item.download_url,
          thumb_url: `https://picsum.photos/id/${item.id}/200/150`,
          source: 'Lorem Picsum',
          width: item.width, height: item.height
        });
      }
      sources.push('Lorem Picsum');
    } catch (e) { console.log('Picsum error:', e.message); }
  }

  document.getElementById('stats').textContent = `鍏?${results.length} 鏉＄粨鏋滐紙鍦ㄧ嚎妯″紡锛屾簮: ${sources.join(', ') || '鏃?}锛塦;
  renderImages(results);
}

// 鈹€鈹€ Render torrents 鈹€鈹€
function renderTorrents(items) {
  document.getElementById('results').innerHTML = items.map(r => `
    <div class="result-card">
      <div class="result-title"><a href="${esc(r.torrent_url || '#')}" target="_blank">${esc(r.title)}</a></div>
      <div class="result-meta">
        <span class="source">${esc(r.source)}</span>
        ${r.seeds ? `<span class="seed">馃敽 ${r.seeds}</span>` : ''}
        ${r.size ? `<span class="size">${esc(r.size)}</span>` : ''}
      </div>
      <div class="result-actions">
        ${r.magnet ? `<button class="btn btn-copy" onclick="copyMagnet('${escJs(r.magnet)}',this)">馃搵 澶嶅埗纾佸姏閾炬帴</button>` : ''}
        ${r.torrent_url ? `<a class="btn btn-visit" href="${esc(r.torrent_url)}" target="_blank">馃敆 鎵撳紑璇︽儏椤?/a>` : ''}
      </div>
    </div>
  `).join('');
}

// 鈹€鈹€ Render pans 鈹€鈹€
function renderPans(items) {
  document.getElementById('results').innerHTML = items.map(r => `
    <div class="result-card">
      <div class="result-title"><a href="${esc(r.url || '#')}" target="_blank">${esc(r.title)}</a></div>
      <div class="result-meta">
        <span class="source">${esc(r.source)}</span>
        ${r.pan_type ? `<span class="pan-type">${esc(r.pan_type)}</span>` : ''}

      <div class="result-actions">
        <a class="btn btn-visit" href="${esc(r.url)}" target="_blank">馃敆 鍓嶅線涓嬭浇</a>
      </div>
    </div>
  `).join('');
}

// 鈹€鈹€ Render images 鈹€鈹€
function renderImages(items) {
  document.getElementById('results').innerHTML = `
    <div class="image-grid">
      ${items.map(r => `
        <div class="image-card">
          <img src="${esc(r.thumb_url || r.url)}" alt="${esc(r.title)}" loading="lazy"
               onclick="openLightbox('${escJs(r.url)}', '${escJs(r.title)}')"
               onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 150%22><rect fill=%22%231a1a24%22 width=%22200%22 height=%22150%22/><text fill=%22%23888%22 x=%22100%22 y=%2280%22 text-anchor=%22middle%22 font-size=%2214%22>鍔犺浇澶辫触</text></svg>'">
          <div class="img-info">
            <div class="img-title">${esc(r.title)}</div>
            <div class="img-source">${esc(r.source)}</div>
          </div>
          <div class="img-actions">
            <button class="btn btn-visit" onclick="event.stopPropagation();openLightbox('${escJs(r.url)}','${escJs(r.title)}')">馃攳 棰勮</button>
            <button class="btn btn-dl" onclick="event.stopPropagation();downloadImage('${escJs(r.url)}','${escJs(r.title)}')">馃捑 淇濆瓨</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// 鈹€鈹€ Render docs 鈹€鈹€
function renderDocs(items) {
  document.getElementById('results').innerHTML = items.map(r => `
    <div class="result-card">
      <div class="result-title"><a href="${esc(r.url || '#')}" target="_blank">${esc(r.title)}</a></div>
      <div class="result-meta">
        <span class="source">${esc(r.source)}</span>
        ${r.file_type ? `<span class="file-type">${esc(r.file_type).toUpperCase()}</span>` : ''}
      </div>
      ${r.snippet ? `<div class="result-snippet">${esc(r.snippet)}</div>` : ''}
      <div class="result-actions">
        <a class="btn btn-visit" href="${esc(r.url)}" target="_blank">馃敆 鎵撳紑閾炬帴</a>
      </div>
    </div>
  `).join('');
}

// 鈹€鈹€ Lightbox 鈹€鈹€
let currentLbUrl = '';
function openLightbox(url, title) {
  currentLbUrl = url;
  document.getElementById('lbImg').src = url;
  document.getElementById('lbImg').alt = title;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  currentLbUrl = '';
}
function downloadLightbox() {
  if (currentLbUrl) downloadImage(currentLbUrl, 'metasearch_image');
}
function downloadImage(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name || 'image'; a.target = '_blank';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// 鈹€鈹€ Copy magnet 鈹€鈹€
function copyMagnet(magnet, btn) {
  navigator.clipboard.writeText(magnet).then(() => {
    btn.classList.add('copied');
    btn.textContent = '鉁?宸插鍒?';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '馃搵 澶嶅埗纾佸姏閾炬帴'; }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = magnet; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.classList.add('copied'); btn.textContent = '鉁?宸插鍒?';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '馃搵 澶嶅埗纾佸姏閾炬帴'; }, 2000);
  });
}

// 鈹€鈹€ Keyboard shortcut 鈹€鈹€
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); document.getElementById('searchInput').focus(); }
});

// 鈹€鈹€ Helpers 鈹€鈹€
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escJs(s) {
  if (!s) return '';
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
}
</script>
