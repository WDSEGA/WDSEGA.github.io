<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Serif SC","STSong","SimSun","Songti SC",serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center}

<body>

<div class="main">

    <div class="field">

        <div class="val" id="roughnessVal">55%</div>

        <input type="range" id="noise" min="0" max="100" value="60">
        <div class="val" id="noiseVal">60%</div>
      </div>
      <div class="field">
        <label>✨ 墨迹飞溅（周围散落墨点）</label>
        <input type="range" id="splatter" min="0" max="100" value="40">
        <div class="val" id="splatterVal">40%</div>
      </div>
      <div class="field">
        <label>🎲 按压不均（深浅随机斑驳，含文字区域）</label>
        <input type="range" id="pressure" min="0" max="100" value="45">
        <div class="val" id="pressureVal">45%</div>
      </div>

      </div>

    <h2>📦 导出</h2>

    </div>

  </div>

  <!-- 右：预览区 -->
  <div class="preview-area">
    <div class="canvas-wrap">
      <canvas id="previewCanvas" width="400" height="400"></canvas>
    </div>
    <div class="export-row">
      <button class="btn btn-secondary" onclick="downloadPNG()">⬇ 透明PNG</button>
      <button class="btn btn-secondary" onclick="downloadJPG()">⬇ 白底JPG</button>
    </div>
    <div class="note" style="text-align:center">实时预览 · 所有参数即时生效</div>

</div>

<script>
// ============================================================
// 模板配置 — 国家标准印章规格
// 推荐值将根据输入文字长度动态计算
// ============================================================
const T = {
  llc:{name:'有限责任公司公章',dia:40,borderW:1.0,starDia:14,
       baseTopFS:46,baseMidFS:34,baseBotFS:26,baseTopSp:18,baseBotSp:22,rwPx:7},
  jsc:{name:'股份有限公司公章',dia:42,borderW:1.2,starDia:18,
       baseTopFS:50,baseMidFS:36,baseBotFS:28,baseTopSp:17,baseBotSp:21,rwPx:8},
  cc: {name:'合同专用章',     dia:58,borderW:1.5,starDia:22,
       baseTopFS:62,baseMidFS:42,baseBotFS:32,baseTopSp:19,baseBotSp:23,rwPx:10},
  inv:{name:'发票专用章',       dia:40,borderW:1.0,starDia:0,
       baseTopFS:44,baseMidFS:30,baseBotFS:24,baseTopSp:17,baseBotSp:21,rwPx:7},
  fin:{name:'财务专用章',       dia:40,borderW:1.0,starDia:15,
       baseTopFS:46,baseMidFS:34,baseBotFS:26,baseTopSp:18,baseBotSp:22,rwPx:7},
  hr: {name:'人事专用章',       dia:40,borderW:1.0,starDia:14,
       baseTopFS:46,baseMidFS:34,baseBotFS:26,baseTopSp:18,baseBotSp:22,rwPx:7}
};

const COLORS = {
  red:     {r:176,g:34,b:34},
  darkred: {r:139,g:0,b:0},
  blue:    {r:0,g:51,b:153}
};

// 确定性伪随机数生成器（种子可复现）
function srnd(seed){var s=seed|0;return function(){s=(s*16807+0)%2147483647;return((s|0)-1)/2147483646}}

// ============================================================
// 动态推荐值计算 — 根据输入文字长度
// ============================================================
function calcRecommended(tplKey, companyLen, codeLen){
  var cfg = T[tplKey];
  var rec = {};

  // 上弧字号：基准值 × 调整系数
  // 字数越多，字号越小。以8字为基准(1.0)，每多1字系数-0.04，每少1字+0.04
  var topAdj = 1.0 - (companyLen - 8) * 0.04;
  topAdj = Math.max(0.7, Math.min(1.3, topAdj));
  rec.topFS = Math.round(cfg.baseTopFS * topAdj);

  // 上弧间距：字数多→间距大（覆盖更大弧段）
  // 基准：8字用 baseTopSp，每多1字+1.5°，每少1字-1.0°
  rec.topSp = Math.round(cfg.baseTopSp + (companyLen - 8) * 1.5);
  rec.topSp = Math.max(12, Math.min(40, rec.topSp));

  // 下弧字号
  var botAdj = codeLen > 0 ? (1.0 - (codeLen - 6) * 0.05) : 1.0;
  botAdj = Math.max(0.7, Math.min(1.3, botAdj));
  rec.botFS = Math.round(cfg.baseBotFS * botAdj);

  // 下弧间距
  rec.botSp = codeLen > 0 ? Math.round(cfg.baseBotSp + (codeLen - 6) * 1.5) : cfg.baseBotSp;
  rec.botSp = Math.max(12, Math.min(45, rec.botSp));

  // 中间字号（固定，不受字数影响）
  rec.midFS = cfg.baseMidFS;
  rec.rwPx = cfg.rwPx;

  return rec;
}

// ============================================================
// 弧排文字
//
// 上弧(12点中心): 字顶朝外(远离圆心) → rot = a + PI/2
// 下弧(6点中心):  字顶朝内(朝向圆心=正向可读) → rot = a - PI/2
// ============================================================
function drawArcText(ctx,text,cx,cy,radius,fontSize,color,isBottom,charDeg,fontFamily){
  if(!text||!text.length)return;
  var n=text.length;
  ctx.fillStyle=color;
  ctx.font='bold '+fontSize+'px '+fontFamily;
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  var totalRad=(n-1)*charDeg*Math.PI/180;
  if(n===1)totalRad=0;

  var centerAngle=isBottom?(Math.PI/2):(-Math.PI/2);
  var startAngle=isBottom?(centerAngle+totalRad/2):(centerAngle-totalRad/2);
  var step=isBottom?(-totalRad/(n-1)):(totalRad/(n-1));
  if(n===1)step=0;

  for(var i=0;i<n;i++){
    var a=startAngle+i*step;
    var x=cx+radius*Math.cos(a);
    var y=cy+radius*Math.sin(a);
    var rot=isBottom?(a-Math.PI/2):(a+Math.PI/2);

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.fillText(text[i],0,0);
    ctx.restore();
  }
}

// 五角星
function drawStar(ctx,cx,cy,outerR,color){
  if(outerR<=0)return;
  var innerR=outerR*0.382;
  ctx.fillStyle=color;
  ctx.beginPath();
  for(var i=0;i<5;i++){
    var oA=-Math.PI/2+i*2*Math.PI/5;
    var iA=oA+Math.PI/5;
    if(i===0)ctx.moveTo(cx+outerR*Math.cos(oA),cy+outerR*Math.sin(oA));
    else ctx.lineTo(cx+outerR*Math.cos(oA),cy+outerR*Math.sin(oA));
    ctx.lineTo(cx+innerR*Math.cos(iA),cy+innerR*Math.sin(iA));
  }
  ctx.closePath();ctx.fill();
}

// ============================================================
// v2.2 做旧系统 — 全区域覆盖（圆环+文字都有做旧效果）
// ============================================================

/**
 * 多频率毛边圆环路径
 */
function roughRingPath(ctx,cx,cy,rOut,rIn,amp,steps){
  var rnd=srnd(42);
  ctx.beginPath();
  for(var i=0;i<=steps;i++){
    var ang=(i/steps)*Math.PI*2;
    var n1=Math.sin(ang*5+rnd()*6.28)*0.55;
    var n2=Math.sin(ang*11+rnd()*6.28)*0.28;
    var n3=Math.sin(ang*23+rnd()*6.28)*0.12;
    var n4=(rnd()-0.5)*0.05;
    var totalOff=n1+n2+n3+n4;
    var rr=rOut*(1+totalOff*amp);
    if(i===0)ctx.moveTo(cx+rr*Math.cos(ang),cy+rr*Math.sin(ang));
    else ctx.lineTo(cx+rr*Math.cos(ang),cy+rr*Math.sin(ang));
  }
  var rnd2=srnd(137);
  for(var i=steps;i>=0;i--){
    var ang=(i/steps)*Math.PI*2;
    var n1=Math.sin(ang*7+rnd2()*6.28)*0.50;
    var n2=Math.sin(ang*15+rnd2()*6.28)*0.25;
    var n3=Math.sin(ang*29+rnd2()*6.28)*0.10;
    var n4=(rnd2()-0.5)*0.06;
    var rr=rIn*(1+(n1+n2+n3+n4)*amp*0.85);
    ctx.lineTo(cx+rr*Math.cos(ang),cy+rr*Math.sin(ang));
  }
  ctx.closePath();
}

function drawAgedRing(ctx,cx,cy,rOut,rIn,color,roughAmp){
  if(roughAmp<=0.005){
    ctx.beginPath();
    ctx.arc(cx,cy,rOut,0,Math.PI*2,false);
    ctx.arc(cx,cy,rIn,0,Math.PI*2,true);
    ctx.closePath();
  }else{
    roughRingPath(ctx,cx,cy,rOut,rIn,roughAmp,480);
  }
  ctx.fillStyle=color;
  ctx.fill();
}

/**
 * v2.2 增强印泥颗粒 — 文字区域也有明显纹理
 * 对整个印章区域（不只是圆环）应用高强度噪声
 */
function applyInkTexture(imgData,intensity,col){
  var d=imgData.data;
  var rnd=srnd(777);
  // 增强：提高噪声幅度，让文字边缘也有明显变化
  var rRange = intensity * 90;  // 原来是70，增强到90
  var gRange = intensity * 60;  // 原来是45
  var bRange = intensity * 45;  // 原来是35
  for(var i=0;i<d.length;i+=4){
    if(d[i+3]>15){
      var nr=(rnd()-0.5)*rRange;
      var ng=(rnd()-0.5)*gRange;
      var nb=(rnd()-0.5)*bRange;
      d[i]=Math.min(255,Math.max(0,d[i]+nr));
      d[i+1]=Math.min(255,Math.max(0,d[i+1]+ng));
      d[i+2]=Math.min(255,Math.max(0,d[i+2]+nb));
    }
  }
}

/**
 * v2.2 墨迹飞溅 — 增加密度和覆盖范围
 */
function applyInkSplatter(ctx,W,H,R,cx,cy,intensity,col){
  var rnd=srnd(3333);
  var cStr='rgb('+col.r+','+col.g+','+col.b+')';
  ctx.fillStyle=cStr;
  // 增加飞溅数量
  var count=Math.floor(intensity*250);  // 原来180，增加到250
  for(var i=0;i<count;i++){
    var dist=rnd()<0.6 ? rnd()*R*1.1 : rnd()*R*1.5;  // 更多在印章内
    var angle=rnd()*Math.PI*2;
    var sx=cx+dist*Math.cos(angle);
    var sy=cy+dist*Math.sin(angle);
    var sz=rnd()<0.9 ? (0.4+rnd()*2.0) : (2+rnd()*5);  // 稍微调小
    var alpha=rnd()<0.7 ? (0.12+rnd()*0.35) : (0.5+rnd()*0.5);
    ctx.globalAlpha=alpha;
    ctx.fillRect(sx,sy,sz,sz);
  }
  ctx.globalAlpha=1;
}

/**
 * v2.2 按压不均 — 扩大覆盖范围，包括文字区域
 */
function applyPressureVariation(imgData,W,H,R,cx,cy,intensity){
  var d=imgData.data;
  var rnd=srnd(8888);
  // 增加斑驳数量
  var patchCount=Math.floor(intensity*18)+5;  // 原来12+3=15，现在18+5=23
  for(var p=0;p<patchCount;p++){
    var pcx=cx+(rnd()-0.5)*R*1.5;  // 覆盖范围扩大到1.5R（原来1.3）
    var pcy=cy+(rnd()-0.5)*R*1.5;
    var pw=R*(0.12+rnd()*0.45);   // 斑驳稍大（原来0.15+0.4）
    var ph=R*(0.08+rnd()*0.35);
    var rot=rnd()*Math.PI;
    var brightness=(rnd()>0.45 ? 1 : -1) * intensity * (25+rnd()*55);  // 强度稍增

    for(var y=0;y<H;y+=2){
      for(var x=0;x<W;x+=2){
        var dx=x-pcx;
        var dy=y-pcy;
        var cosT=Math.cos(-rot);
        var sinT=Math.sin(-rot);
        var ex=dx*cosT-dy*sinT;
        var ey=dx*sinT+dy*cosT;
        var norm=(ex*ex)/(pw*pw)+(ey*ey)/(ph*ph);
        if(norm<=1){
          var falloff=1-norm;
          falloff=falloff*falloff;
          var idx=(y*W+x)*4;
          if(d[idx+3]>15){
            d[idx]=Math.min(255,Math.max(0,d[idx]+brightness*falloff));
            d[idx+1]=Math.min(255,Math.max(0,d[idx+1]+brightness*falloff*0.85));
            d[idx+2]=Math.min(255,Math.max(0,d[idx+2]+brightness*falloff*0.7));
          }
        }
      }
    }
  }
}

// ============================================================
// 主渲染
// ============================================================
function render(){
  var cvs=document.getElementById('previewCanvas');
  var ctx=cvs.getContext('2d');
  var W=400,H=400;cvs.width=W;cvs.height=H;
  var cx=W/2,cy=H/2;

  // ---- 读参数 ----
  var tplKey=document.getElementById('tpl').value;
  var cfg=T[tplKey];
  var company=document.getElementById('companyName').value.trim()||'测试科技有限公司';
  var sealType=document.getElementById('sealType').value.trim()||'公章';
  var code=document.getElementById('sealCode').value.trim();
  var taxIdStr=document.getElementById('taxId').value.trim();

  var cKey=document.getElementById('sealColor').value;
  var col=COLORS[cKey];
  var cStr='rgb('+col.r+','+col.g+','+col.b+')';

  // 动态获取推荐值，用于决定默认滑块位置
  var rec = calcRecommended(tplKey, company.length, code.length);

  // 使用滑块值（用户手动调节后不再用推荐值）
  var tFS=parseInt(document.getElementById('topFontSize').value);
  var bFS=parseInt(document.getElementById('bottomFontSize').value);
  var mFS=parseInt(document.getElementById('midFontSize').value);
  var tSp=parseInt(document.getElementById('topSpacing').value);
  var bSp=parseInt(document.getElementById('bottomSpacing').value);
  var rwPx=parseInt(document.getElementById('ringWidth').value);
  var fontFam=document.getElementById('sealFont').value;

  var agingOn=document.getElementById('agingEnabled').checked;
  var rLv=agingOn?document.getElementById('roughness').value/100:0;
  var nLv=agingOn?document.getElementById('noise').value/100:0;
  var sLv=agingOn?document.getElementById('splatter').value/100:0;
  var pLv=agingOn?document.getElementById('pressure').value/100:0;
  var bLv=agingOn?document.getElementById('blur').value/100:0;
  var afk=agingOn&&document.getElementById('antiFake').checked;

  // ---- 尺寸计算 ----
  var pxPerMm=W*0.82/cfg.dia;
  var diaPx=cfg.dia*pxPerMm;
  var R=diaPx/2;
  var rw=Math.max(rwPx,2.5);

  ctx.clearRect(0,0,W,H);

  // === 离屏绘制 ===
  var mcCvs=document.createElement('canvas');mcCvs.width=W;mcCvs.height=H;
  var mc=mcCvs.getContext('2d');

  // --- 圆环（可选毛边）---
  var rOuter=R;
  var rInner=R-rw;
  var roughAmp=rLv*0.04;

  drawAgedRing(mc,cx,cy,rOuter,rInner,cStr,roughAmp);

  // --- 上弧文字 ---
  var textR=rInner-tFS*0.55;
  drawArcText(mc,company,cx,cy,textR,tFS,cStr,false,tSp,fontFam);

  // --- 中间区域 ---
  var hasStar=(cfg.starDia>0);
  var isInvTax=(tplKey==='inv'&&taxIdStr.length>0);

  if(isInvTax){
    mc.font='bold '+mFS+'px '+fontFam;
    mc.textAlign='center';mc.textBaseline='middle';
    mc.fillStyle=cStr;
    mc.fillText(taxIdStr,cx,cy);
  }else if(hasStar){
    var sR=cfg.starDia/2*pxPerMm;
    drawStar(mc,cx,cy,sR,cStr);
    mc.font='bold '+mFS+'px '+fontFam;
    mc.textAlign='center';mc.textBaseline='middle';
    mc.fillStyle=cStr;
    mc.fillText(sealType,cx,cy+sR+mFS*0.55);
  }else{
    mc.font='bold '+mFS+'px '+fontFam;
    mc.textAlign='center';mc.textBaseline='middle';
    mc.fillStyle=cStr;
    mc.fillText(sealType,cx,cy);
  }

  // --- 下弧文字 ---
  if(code){
    var botTextR=rInner-bFS*0.55;
    drawArcText(mc,code,cx,cy,botTextR,bFS,cStr,true,bSp,fontFam);
  }

  // --- 防伪纹路 ---
  if(afk){
    mc.save();mc.globalCompositeOperation='source-atop';
    mc.strokeStyle='rgba('+col.r+','+col.g+','+col.b+',0.08)';
    mc.lineWidth=0.5;
    var r3=srnd(999);
    for(var i=0;i<40;i++){
      var a1=r3()*Math.PI*2;
      var a2=a1+0.03+r3()*0.2;
      var rr1=R*0.2+r3()*R*0.68;
      var rr2=rr1+r3()*R*0.05;
      mc.beginPath();
      mc.moveTo(cx+rr1*Math.cos(a1),cy+rr1*Math.sin(a1));
      mc.lineTo(cx+rr2*Math.cos(a2),cy+rr2*Math.sin(a2));
      mc.stroke();
    }
    for(var i=0;i<200;i++){
      var ax=cx+(r3()-0.5)*R*1.42;
      var ay=cy+(r3()-0.5)*R*1.42;
      if(Math.sqrt((ax-cx)*(ax-cx)+(ay-cy)*(ay-cy))<R*1.04){
        mc.fillRect(ax,ay,0.7+r3()*1.5,0.7+r3()*1.5);
      }
    }
    mc.restore();
  }

  // 合成到主画布
  ctx.drawImage(mcCvs,0,0);

  // === 做旧效果层（在主画布上操作像素）===
  if(agingOn && (rLv>0 || nLv>0 || sLv>0 || pLv>0 || bLv>0)){
    try{
      var imgData=ctx.getImageData(0,0,W,H);

      // 1) 印泥颗粒/纹理（全区域，含文字）
      if(nLv>0) applyInkTexture(imgData,nLv,col);

      // 2) 按压不均（深浅斑驳，全区域含文字）
      if(pLv>0) applyPressureVariation(imgData,W,H,R,cx,cy,pLv);

      ctx.putImageData(imgData,0,0);

      // 3) 墨迹飞溅（在合成后叠加）
      if(sLv>0) applyInkSplatter(ctx,W,H,R,cx,cy,sLv,col);
    }catch(e){
      console.warn('Aging effect error:',e);
    }
  }

  // --- 边缘虚化/磨损 ---
  if(bLv>0){
    try{
      var tCvs=document.createElement('canvas');tCvs.width=W;tCvs.height=H;
      var tc=tCvs.getContext('2d');
      var fGrd=tc.createRadialGradient(cx,cy,R*0.55,cx,cy,R*1.08);
      fGrd.addColorStop(0,'rgba(0,0,0,0)');
      fGrd.addColorStop(0.7,'rgba(0,0,0,'+(bLv*0.15)+')');
      fGrd.addColorStop(1,'rgba(0,0,0,'+(bLv*0.5)+')');
      tc.fillStyle=fGrd;tc.fillRect(0,0,W,H);
      var fCvs=document.createElement('canvas');fCvs.width=W;fCvs.height=H;
      var fc=fCvs.getContext('2d');
      fc.drawImage(ctx.canvas,0,0);
      fc.globalCompositeOperation='destination-out';
      fc.drawImage(tCvs,0,0);
      ctx.clearRect(0,0,W,H);ctx.drawImage(fCvs,0,0);
    }catch(e){
      console.warn('Blur effect error:',e);
    }
  }
}

// ============================================================
// UI — 动态推荐值
// ============================================================
function updateRefInfo(){
  var tplKey=document.getElementById('tpl').value;
  var cfg=T[tplKey];
  var company=document.getElementById('companyName').value.trim()||'测试科技有限公司';
  var code=document.getElementById('sealCode').value.trim();

  // 动态计算推荐值
  var rec = calcRecommended(tplKey, company.length, code.length);

  document.getElementById('tplRef').innerHTML=
    '<b>'+cfg.name+'</b><br>'+
    '直径: &Oslash;'+cfg.dia+'mm | 边框宽: '+cfg.borderW+
    'mm | 五角星: '+(cfg.starDia>0?cfg.starDia:'无')+'mm<br>'+
    '（输入 '+company.length+' 字公司名，推荐值已自动调整）';

  document.getElementById('ringWidthRef').textContent='推荐: '+cfg.rwPx+'px';
  document.getElementById('ringWidthVal').textContent=
    document.getElementById('ringWidth').value+'px';

  // 动态推荐值：显示当前字数的推荐值
  document.getElementById('topFSRef').textContent='推荐('+company.length+'字): '+rec.topFS+'px';
  document.getElementById('botFSRef').textContent='推荐('+(code.length||'-')+'字): '+rec.botFS+'px';
  document.getElementById('midFSRef').textContent='推荐: '+rec.midFS+'px';
  document.getElementById('topSpRef').textContent='推荐('+company.length+'字): '+rec.topSp+'°/字';
  document.getElementById('botSpRef').textContent='推荐('+(code.length||'-')+'字): '+rec.botSp+'°/字';

  document.getElementById('topFontSizeVal').textContent=
    document.getElementById('topFontSize').value+'px';
  document.getElementById('bottomFontSizeVal').textContent=
    document.getElementById('bottomFontSize').value+'px';
  document.getElementById('midFontSizeVal').textContent=
    document.getElementById('midFontSize').value+'px';
  document.getElementById('topSpacingVal').textContent=
    document.getElementById('topSpacing').value+'°/字';
  document.getElementById('bottomSpacingVal').textContent=
    document.getElementById('bottomSpacing').value+'°/字';

  document.getElementById('fontRef').innerHTML=
    '<b>动态推荐值（根据输入字数自动计算）</b><br>'+
    '当前: '+company.length+'字公司名 + '+(code.length||0)+'字编码<br>'+
    '上弧: <b>'+rec.topFS+'px</b> / <b>'+rec.topSp+'&deg;</b> &nbsp;|&nbsp;'+
    '中间: <b>'+rec.midFS+'px</b> &nbsp;|&nbsp;'+
    '下弧: <b>'+rec.botFS+'px</b> / <b>'+rec.botSp+'&deg;</b>';
}

function updateUI(){
  var k=document.getElementById('tpl').value;
  document.getElementById('taxIdGroup').style.display=(k==='inv')?'flex':'none';
  if(k!=='inv')document.getElementById('taxId').value='';
  document.getElementById('agingOptions').style.display=
    document.getElementById('agingEnabled').checked?'block':'none';
  updateRefInfo();
}

function bindEvents(){
  var ids=['tpl','companyName','sealType','sealCode','taxId','sealColor',
           'sealFont','topFontSize','bottomFontSize','midFontSize',
           'topSpacing','bottomSpacing','ringWidth',
           'roughness','noise','splatter','pressure','blur',
           'agingEnabled','antiFake'];
  ids.forEach(function(id){
    var el=document.getElementById(id);
    if(el){
      el.addEventListener('input',function(){render();updateRefInfo()});
      el.addEventListener('change',function(){render();updateUI()});
    }
  });

  var rangeMap={
    topFontSize:'px', bottomFontSize:'px', midFontSize:'px',
    topSpacing:'\u00B0/\u5b57', bottomSpacing:'\u00B0/\u5b57',
    ringWidth:'px',
    roughness:'%', noise:'%', splatter:'%', pressure:'%', blur:'%'
  };
  Object.keys(rangeMap).forEach(function(id){
    var el=document.getElementById(id);
    var vl=document.getElementById(id+'Val');
    if(el&&vl){
      el.addEventListener('input',function(){vl.textContent=el.value+rangeMap[id]});
    }
  });
}

// ============================================================
// 导出
// ============================================================
function downloadPNG(){
  var pv=document.getElementById('previewCanvas');
  var oc=document.createElement('canvas');oc.width=800;oc.height=800;
  var octx=oc.getContext('2d');octx.drawImage(pv,0,0,800,800);
  var a=document.createElement('a');
  a.download='seal_'+Date.now()+'.png';a.href=oc.toDataURL('image/png');a.click();
}

function downloadJPG(){
  var pv=document.getElementById('previewCanvas');
  var tc=document.createElement('canvas');tc.width=800;tc.height=800;
  var tctx=tc.getContext('2d');
  tctx.fillStyle='#ffffff';tctx.fillRect(0,0,800,800);
  tctx.drawImage(pv,0,0,800,800);
  var a=document.createElement('a');
  a.download='seal_'+Date.now()+'.jpg';a.href=tc.toDataURL('image/jpeg',0.92);a.click();
}

// 启动
document.addEventListener('DOMContentLoaded',function(){
  bindEvents();updateUI();render();
});
</script>
