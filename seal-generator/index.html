<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子印章生成器 v1.5 | Electronic Seal Generator</title>
<meta name="description" content="免费在线电子印章生成器，仿真实印章比例，支持弧形/水平文字，做旧毛边防伪纹路效果，导出透明PNG。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Serif SC","STSong","SimSun","Songti SC",serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{width:100%;background:#16213e;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0f3460}
.header h1{font-size:20px;color:#e94560}
.header a{color:#e94560;text-decoration:none;font-size:14px}
.main{display:flex;width:100%;max-width:1200px;flex:1;padding:16px;gap:16px;flex-wrap:wrap}
.panel{width:340px;min-width:300px;background:#16213e;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;height:fit-content;max-height:calc(100vh - 80px);overflow-y:auto}
.panel h2{font-size:15px;color:#e94560;border-bottom:1px solid #0f3460;padding-bottom:6px;margin-bottom:2px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:#aaa}
.field select,.field input[type="text"]{background:#0f3460;color:#e0e0e0;border:1px solid #e94560;border-radius:4px;padding:6px 8px;font-size:13px;font-family:inherit}
.field input[type="range"]{width:100%}
.row{display:flex;gap:8px;align-items:flex-end}
.row .field{flex:1}
.val{font-size:11px;color:#e94560;text-align:right}
.ref{font-size:10px;color:#4a90d9;text-align:right;margin-top:-2px;font-weight:bold}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:8px;border:none;border-radius:4px;font-size:14px;cursor:pointer;font-family:inherit}
.btn-primary{background:#e94560;color:#fff}
.btn-secondary{background:#0f3460;color:#e0e0e0;border:1px solid #e94560}
.btn:hover{opacity:0.85}
.note{font-size:11px;color:#888;line-height:1.4}
.preview-area{flex:1;min-width:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.canvas-wrap{background:#ccc;background-image:linear-gradient(45deg,#aaa 25%,transparent 25%),linear-gradient(-45deg,#aaa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aaa 75%),linear-gradient(-45deg,transparent 75%,#aaa 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0px;border-radius:8px;padding:20px;display:flex;align-items:center;justify-content:center}
.canvas-wrap canvas{background:#fff;border-radius:4px}
.export-row{display:flex;gap:8px}
.switch{display:flex;align-items:center;gap:8px}
.switch input{width:auto;accent-color:#e94560}
.flag{font-size:10px;color:#e94560;background:#0f3460;padding:2px 6px;border-radius:3px;margin-left:4px}
.section-ref{font-size:10px;color:#4a90d9;background:#0d1b33;padding:4px 6px;border-radius:3px;margin-top:-4px;line-height:1.6}
</style>
</head>
<body>
<div class="header">
  <h1>📛 电子印章生成器</h1>
  <a href="/">← 返回博客首页</a>
</div>

<div class="main">
  <!-- 左：设置面板 -->
  <div class="panel">
    <h2>⚙️ 印章设置</h2>

    <div class="field">
      <label>印章模板</label>
      <select id="tpl">
        <option value="llc">有限责任公司公章 (Ø40mm)</option>
        <option value="jsc">股份有限公司公章 (Ø42mm)</option>
        <option value="cc">合同专用章 (Ø58mm)</option>
        <option value="inv">发票专用章 (Ø40mm)</option>
        <option value="fin">财务专用章 (Ø40mm)</option>
        <option value="hr">人事专用章 (Ø40mm)</option>
      </select>
      <div id="tplRef" class="section-ref"></div>
    </div>

    <div class="field">
      <label>公司名称（上弧文字）</label>
      <input type="text" id="companyName" value="测试科技有限公司" placeholder="输入公司/单位名称">
    </div>

    <div class="field">
      <label>印章类型（中间水平文字）<span class="flag">水平排列</span></label>
      <input type="text" id="sealType" value="公章" placeholder="如：财务专用章">
    </div>

    <div class="field">
      <label>编码/英文（下弧文字，可留空）</label>
      <input type="text" id="sealCode" value="" placeholder="如：12345678">
    </div>

    <div class="field" id="taxIdGroup" style="display:none;">
      <label>税号（发票专用章中间）</label>
      <input type="text" id="taxId" value="" placeholder="如：91110108MA01XXXXX">
    </div>

    <h2>⭕ 圆环</h2>

    <div class="field">
      <label>圆环粗细</label>
      <input type="range" id="ringWidth" min="3" max="20" value="7">
      <div class="val" id="ringWidthVal">7px</div>
      <div class="ref" id="ringWidthRef">推荐: 7px</div>
    </div>

    <h2>🔤 字体与间距</h2>
    <div id="fontRef" class="section-ref"></div>

    <div class="row">
      <div class="field">
        <label>上弧字号</label>
        <input type="range" id="topFontSize" min="18" max="72" value="46">
        <div class="val" id="topFontSizeVal">46px</div>
        <div class="ref" id="topFSRef">推荐: 46px</div>
      </div>
      <div class="field">
        <label>下弧字号</label>
        <input type="range" id="bottomFontSize" min="14" max="48" value="26">
        <div class="val" id="bottomFontSizeVal">26px</div>
        <div class="ref" id="botFSRef">推荐: 26px</div>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>上弧字间距</label>
        <input type="range" id="topSpacing" min="10" max="50" value="18">
        <div class="val" id="topSpacingVal">18°/字</div>
        <div class="ref" id="topSpRef">推荐: 18°/字</div>
      </div>
      <div class="field">
        <label>下弧字间距</label>
        <input type="range" id="bottomSpacing" min="10" max="50" value="22">
        <div class="val" id="bottomSpacingVal">22°/字</div>
        <div class="ref" id="botSpRef">推荐: 22°/字</div>
      </div>
    </div>

    <div class="field">
      <label>中间字号（水平文字）</label>
      <input type="range" id="midFontSize" min="18" max="65" value="34">
      <div class="val" id="midFontSizeVal">34px</div>
      <div class="ref" id="midFSRef">推荐: 34px</div>
    </div>

    <div class="field">
      <label>字体</label>
      <select id="sealFont">
        <option value='"Noto Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", "Songti SC", serif'>宋体 (Serif)</option>
        <option value='"KaiTi", "STKaiti", "KaiTi_GB2312"'>楷体</option>
        <option value='"FangSong", "STFangsong"'>仿宋</option>
        <option value='"Microsoft YaHei", "PingFang SC", sans-serif'>微软雅黑</option>
      </select>
    </div>

    <h2>🎨 颜色与做旧</h2>

    <div class="field">
      <label>印章颜色</label>
      <select id="sealColor">
        <option value="red">公章红 (#B02222)</option>
        <option value="darkred">深红 (#8B0000)</option>
        <option value="blue">蓝印 (#003399)</option>
      </select>
    </div>

    <div class="field switch">
      <label style="flex:1">🕰️ 做旧效果</label>
      <input type="checkbox" id="agingEnabled">
    </div>

    <div id="agingOptions" style="display:none;">
      <div class="field">
        <label>毛边强度</label>
        <input type="range" id="roughness" min="0" max="100" value="20">
        <div class="val" id="roughnessVal">20%</div>
      </div>
      <div class="field">
        <label>印泥颗粒</label>
        <input type="range" id="noise" min="0" max="100" value="15">
        <div class="val" id="noiseVal">15%</div>
      </div>
      <div class="field">
        <label>边缘虚化</label>
        <input type="range" id="blur" min="0" max="100" value="10">
        <div class="val" id="blurVal">10%</div>
      </div>
      <div class="field switch">
        <label style="flex:1">🔒 防伪纹路</label>
        <input type="checkbox" id="antiFake">
      </div>
    </div>

    <h2>📦 导出</h2>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="downloadPNG()">⬇ 透明PNG (2x)</button>
      <button class="btn btn-secondary" onclick="downloadJPG()">⬇ 白底JPG (2x)</button>
    </div>
    <div class="note">高清2倍导出，透明PNG可直接贴到文档中。</div>
  </div>

  <!-- 右：预览区 -->
  <div class="preview-area">
    <div class="canvas-wrap">
      <canvas id="previewCanvas" width="400" height="400"></canvas>
    </div>
    <div class="export-row">
      <button class="btn btn-secondary" onclick="downloadPNG()">⬇ 透明PNG</button>
      <button class="btn btn-secondary" onclick="downloadJPG()">⬇ 白底JPG</button>
    </div>
    <div class="note" style="text-align:center">实时预览 · 所有参数即时生效</div>
  </div>
</div>

<script>
// ============================================================
// 模板配置 — 国家标准印章规格
// ============================================================
const T = {
  llc:{name:'有限责任公司公章',dia:40,borderW:1.0,starDia:14,
       topFS:46,midFS:34,botFS:26,topSp:18,botSp:22,rwPx:7},
  jsc:{name:'股份有限公司公章',dia:42,borderW:1.2,starDia:18,
       topFS:50,midFS:36,botFS:28,topSp:17,botSp:21,rwPx:8},
  cc: {name:'合同专用章',     dia:58,borderW:1.5,starDia:22,
       topFS:62,midFS:42,botFS:32,topSp:19,botSp:23,rwPx:10},
  inv:{name:'发票专用章',       dia:40,borderW:1.0,starDia:0,
       topFS:44,midFS:30,botFS:24,topSp:17,botSp:21,rwPx:7},
  fin:{name:'财务专用章',       dia:40,borderW:1.0,starDia:15,
       topFS:46,midFS:34,botFS:26,topSp:18,botSp:22,rwPx:7},
  hr: {name:'人事专用章',       dia:40,borderW:1.0,starDia:14,
       topFS:46,midFS:34,botFS:26,topSp:18,botSp:22,rwPx:7}
};

const COLORS = {
  red:     {r:176,g:34,b:34},
  darkred: {r:139,g:0,b:0},
  blue:    {r:0,g:51,b:153}
};

function srnd(seed){var s=seed|0;return function(){s=(s*16807+0)%2147483647;return((s|0)-1)/2147483646}}

// ============================================================
// 弧排文字
//
// 上弧: center=-PI/2(12点), 从左到右, rot=a+PI/2 (字顶朝外)
// 下弧: center=+PI/2(6点),  从左到右, rot=a-PI/2 (字顶朝上可读)
// ============================================================
function drawArcText(ctx,text,cx,cy,radius,fontSize,color,isBottom,charDeg,fontFamily){
  if(!text||!text.length)return;
  var n=text.length;
  ctx.fillStyle=color;
  ctx.font='bold '+fontSize+'px '+fontFamily;
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  // 总弧度（角度制转弧度）
  var totalRad=(n-1)*charDeg*Math.PI/180;
  if(n===1)totalRad=0;

  // 中心角
  var centerAngle=isBottom?(Math.PI/2):(-Math.PI/2);

  // 起始角度：
  //   上弧: center - total/2（左边开始，向右递增）
  //   下弧: center + total/2（左边开始=大角度，向右递减）
  var startAngle=isBottom?(centerAngle+totalRad/2):(centerAngle-totalRad/2);
  var step=isBottom?(-totalRad/(n-1)):(totalRad/(n-1));
  if(n===1)step=0;

  for(var i=0;i<n;i++){
    var a=startAngle+i*step;
    var x=cx+radius*Math.cos(a);
    var y=cy+radius*Math.sin(a);

    // 字顶朝向：
    //   上弧：径向外部 = a + PI/2（12点钟位置 rot=0，正向）
    //   下弧：径向内部朝上可读 = a - PI/2（6点钟位置 rot=0，正向）
    var rot=isBottom?(a-Math.PI/2):(a+Math.PI/2);

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.fillText(text[i],0,0);
    ctx.restore();
  }
}

// 五角星
function drawStar(ctx,cx,cy,outerR,color){
  if(outerR<=0)return;
  var innerR=outerR*0.382;
  ctx.fillStyle=color;
  ctx.beginPath();
  for(var i=0;i<5;i++){
    var oA=-Math.PI/2+i*2*Math.PI/5;
    var iA=oA+Math.PI/5;
    if(i===0)ctx.moveTo(cx+outerR*Math.cos(oA),cy+outerR*Math.sin(oA));
    else ctx.lineTo(cx+outerR*Math.cos(oA),cy+outerR*Math.sin(oA));
    ctx.lineTo(cx+innerR*Math.cos(iA),cy+innerR*Math.sin(iA));
  }
  ctx.closePath();ctx.fill();
}

// 毛边圆形路径
function roughCircle(ctx,cx,cy,r,seed,amp){
  var steps=360;var rnd=srnd(seed|0);
  ctx.beginPath();
  for(var i=0;i<=steps;i++){
    var ang=(i/steps)*Math.PI*2;
    var off=(rnd()-0.5)*2*amp;
    var rr=r*(1+off);
    if(i===0)ctx.moveTo(cx+rr*Math.cos(ang),cy+rr*Math.sin(ang));
    else ctx.lineTo(cx+rr*Math.cos(ang),cy+rr*Math.sin(ang));
  }
  ctx.closePath();
}

// 单圈实心圆环（fill方式）
function drawSingleRing(ctx,cx,cy,rOut,rIn,color,useRough,roughAmp){
  ctx.fillStyle=color;
  if(useRough&&roughAmp>0){
    roughCircle(ctx,cx,cy,rOut,100,roughAmp);
    for(var i=360;i>=0;i--){
      var ang=(i/360)*Math.PI*2;
      var rnd=srnd(200)();
      var rr=rIn*(1+(rnd()-0.5)*2*roughAmp*0.7);
      ctx.lineTo(cx+rr*Math.cos(ang),cy+rr*Math.sin(ang));
    }
    ctx.closePath();
  }else{
    ctx.beginPath();
    ctx.arc(cx,cy,rOut,0,Math.PI*2,false);
    ctx.arc(cx,cy,rIn,0,Math.PI*2,true);
    ctx.closePath();
  }
  ctx.fill();
}

// ============================================================
// 主渲染
// ============================================================
function render(){
  var cvs=document.getElementById('previewCanvas');
  var ctx=cvs.getContext('2d');
  var W=400,H=400;cvs.width=W;cvs.height=H;
  var cx=W/2,cy=H/2;

  // ---- 读参数 ----
  var tplKey=document.getElementById('tpl').value;
  var cfg=T[tplKey];
  var company=document.getElementById('companyName').value.trim()||'测试科技有限公司';
  var sealType=document.getElementById('sealType').value.trim()||'公章';
  var code=document.getElementById('sealCode').value.trim();
  var taxIdStr=document.getElementById('taxId').value.trim();

  var cKey=document.getElementById('sealColor').value;
  var col=COLORS[cKey];
  var cStr='rgb('+col.r+','+col.g+','+col.b+')';

  var tFS=parseInt(document.getElementById('topFontSize').value);
  var bFS=parseInt(document.getElementById('bottomFontSize').value);
  var mFS=parseInt(document.getElementById('midFontSize').value);
  var tSp=parseInt(document.getElementById('topSpacing').value);
  var bSp=parseInt(document.getElementById('bottomSpacing').value);
  var rwPx=parseInt(document.getElementById('ringWidth').value);
  var fontFam=document.getElementById('sealFont').value;

  var agingOn=document.getElementById('agingEnabled').checked;
  var rLv=agingOn?document.getElementById('roughness').value/100:0;
  var nLv=agingOn?document.getElementById('noise').value/100:0;
  var bLv=agingOn?document.getElementById('blur').value/100:0;
  var afk=agingOn&&document.getElementById('antiFake').checked;

  // ---- 尺寸计算 ----
  // 印章直径占Canvas 82%
  var pxPerMm=W*0.82/cfg.dia;
  var diaPx=cfg.dia*pxPerMm;
  var R=diaPx/2;

  // 单圈圆环参数
  var rw=Math.max(rwPx,2.5);

  ctx.clearRect(0,0,W,H);

  // === 离屏绘制 ===
  var mcCvs=document.createElement('canvas');mcCvs.width=W;mcCvs.height=H;
  var mc=mcCvs.getContext('2d');

  // --- 单圈实心圆环 ---
  var rOuter=R;
  var rInner=R-rw;

  drawSingleRing(mc,cx,cy,rOuter,rInner,cStr,rLv>0,rLv*0.02);

  // --- 上弧文字 ---
  var textR=rInner-rw-tFS*0.08;
  drawArcText(mc,company,cx,cy,textR,tFS,cStr,false,tSp,fontFam);

  // --- 中间区域 ---
  var hasStar=(cfg.starDia>0);
  var isInvTax=(tplKey==='inv'&&taxIdStr.length>0);

  if(isInvTax){
    mc.font='bold '+mFS+'px '+fontFam;
    mc.textAlign='center';mc.textBaseline='middle';
    mc.fillStyle=cStr;
    mc.fillText(taxIdStr,cx,cy);
  }else if(hasStar){
    var sR=cfg.starDia/2*pxPerMm;
    drawStar(mc,cx,cy,sR,cStr);
    mc.font='bold '+mFS+'px '+fontFam;
    mc.textAlign='center';mc.textBaseline='middle';
    mc.fillStyle=cStr;
    mc.fillText(sealType,cx,cy+sR+mFS*0.55);
  }else{
    mc.font='bold '+mFS+'px '+fontFam;
    mc.textAlign='center';mc.textBaseline='middle';
    mc.fillStyle=cStr;
    mc.fillText(sealType,cx,cy);
  }

  // --- 下弧文字（编码）---
  if(code){
    var botTextR=rInner-rw-bFS*0.05;
    drawArcText(mc,code,cx,cy,botTextR,bFS,cStr,true,bSp,fontFam);
  }

  // --- 防伪纹路 ---
  if(afk){
    mc.save();mc.globalCompositeOperation='source-atop';
    mc.strokeStyle='rgba('+col.r+','+col.g+','+col.b+',0.07)';
    mc.lineWidth=0.5;
    var r3=srnd(999);
    for(var i=0;i<35;i++){
      var a1=r3()*Math.PI*2;
      var a2=a1+0.04+r3()*0.18;
      var rr1=R*0.25+r3()*R*0.65;
      var rr2=rr1+r3()*R*0.04;
      mc.beginPath();
      mc.moveTo(cx+rr1*Math.cos(a1),cy+rr1*Math.sin(a1));
      mc.lineTo(cx+rr2*Math.cos(a2),cy+rr2*Math.sin(a2));
      mc.stroke();
    }
    for(var i=0;i<150;i++){
      var ax=cx+(r3()-0.5)*R*1.4;
      var ay=cy+(r3()-0.5)*R*1.4;
      if(Math.sqrt((ax-cx)*(ax-cx)+(ay-cy)*(ay-cy))<R*1.02){
        mc.fillRect(ax,ay,0.8+r3()*1.2,0.8+r3()*1.2);
      }
    }
    mc.restore();
  }

  // 合成
  ctx.drawImage(mcCvs,0,0);

  // --- 边缘虚化 ---
  if(bLv>0){
    var tCvs=document.createElement('canvas');tCvs.width=W;tCvs.height=H;
    var tc=tCvs.getContext('2d');
    var fGrd=tc.createRadialGradient(cx,cy,R*0.65,cx,cy,R*1.06);
    fGrd.addColorStop(0,'rgba(0,0,0,0)');
    fGrd.addColorStop(1,'rgba(0,0,0,'+(bLv*0.38)+')');
    tc.fillStyle=fGrd;tc.fillRect(0,0,W,H);
    var fCvs=document.createElement('canvas');fCvs.width=W;fCvs.height=H;
    var fc=fCvs.getContext('2d');
    fc.drawImage(ctx.canvas,0,0);
    fc.globalCompositeOperation='destination-out';
    fc.drawImage(tCvs,0,0);
    ctx.clearRect(0,0,W,H);ctx.drawImage(fCvs,0,0);
  }

  // --- 印泥颗粒 ---
  if(nLv>0){
    var imgData=ctx.getImageData(0,0,W,H);
    var px=imgData.data;
    var r4=srnd(777);
    for(var i=0;i<px.length;i+=4){
      if(px[i+3]>10){
        var nv=(r4()-0.5)*2*nLv*42;
        px[i]=Math.min(255,Math.max(0,px[i]+nv));
        px[i+1]=Math.min(255,Math.max(0,px[i+1]+nv));
        px[i+2]=Math.min(255,Math.max(0,px[i+2]+nv));
      }
    }
    ctx.putImageData(imgData,0,0);
  }
}

// ============================================================
// UI — 显示每个模板的默认推荐值
// ============================================================
function updateRefInfo(){
  var tplKey=document.getElementById('tpl').value;
  var cfg=T[tplKey];

  // 模板规格参考
  document.getElementById('tplRef').innerHTML=
    '<b>'+cfg.name+'</b><br>'+
    '直径: &Oslash;'+cfg.dia+'mm | 边框宽: '+cfg.borderW+
    'mm | 五角星: '+(cfg.starDia>0?cfg.starDia:'无')+'mm<br>'+
    '比例: 圆环占印章 '+((cfg.borderW/cfg.dia)*100).toFixed(1)+'%';

  // 圆环粗细
  document.getElementById('ringWidthRef').textContent='推荐: '+cfg.rwPx+'px';
  document.getElementById('ringWidthVal').textContent=
    document.getElementById('ringWidth').value+'px';

  // 字号和间距
  document.getElementById('topFSRef').textContent='推荐: '+cfg.topFS+'px';
  document.getElementById('botFSRef').textContent='推荐: '+cfg.botFS+'px';
  document.getElementById('midFSRef').textContent='推荐: '+cfg.midFS+'px';
  document.getElementById('topSpRef').textContent='推荐: '+cfg.topSp+'°/字';
  document.getElementById('botSpRef').textContent='推荐: '+cfg.botSp+'°/字';

  document.getElementById('topFontSizeVal').textContent=
    document.getElementById('topFontSize').value+'px';
  document.getElementById('bottomFontSizeVal').textContent=
    document.getElementById('bottomFontSize').value+'px';
  document.getElementById('midFontSizeVal').textContent=
    document.getElementById('midFontSize').value+'px';
  document.getElementById('topSpacingVal').textContent=
    document.getElementById('topSpacing').value+'°/字';
  document.getElementById('bottomSpacingVal').textContent=
    document.getElementById('bottomSpacing').value+'°/字';

  // 总览
  document.getElementById('fontRef').innerHTML=
    '<b>当前模板推荐值</b><br>'+
    '上弧: '+cfg.topFS+'px / '+cfg.topSp+'&deg;&middot;每字 &nbsp;|&nbsp;'+
    '中间: '+cfg.midFS+'px &nbsp;|&nbsp;'+
    '下弧: '+cfg.botFS+'px / '+cfg.botSp+'&deg;&middot;每字 &nbsp;|&nbsp;'+
    '圆环: '+cfg.rwPx+'px';
}

function updateUI(){
  var k=document.getElementById('tpl').value;
  document.getElementById('taxIdGroup').style.display=(k==='inv')?'flex':'none';
  if(k!=='inv')document.getElementById('taxId').value='';
  document.getElementById('agingOptions').style.display=
    document.getElementById('agingEnabled').checked?'block':'none';
  updateRefInfo();
}

// ============================================================
// 事件绑定
// ============================================================
function bindEvents(){
  var ids=['tpl','companyName','sealType','sealCode','taxId','sealColor',
           'sealFont','topFontSize','bottomFontSize','midFontSize',
           'topSpacing','bottomSpacing','ringWidth',
           'roughness','noise','blur',
           'agingEnabled','antiFake'];
  ids.forEach(function(id){
    var el=document.getElementById(id);
    if(el){
      el.addEventListener('input',render);
      el.addEventListener('change',function(){render();updateUI()});
    }
  });

  // 滑块数值更新
  var rangeMap={
    topFontSize:'px', bottomFontSize:'px', midFontSize:'px',
    topSpacing:'\u00B0/\u5b57', bottomSpacing:'\u00B0/\u5b57',
    ringWidth:'px',
    roughness:'%', noise:'%', blur:'%'
  };
  Object.keys(rangeMap).forEach(function(id){
    var el=document.getElementById(id);
    var vl=document.getElementById(id+'Val');
    if(el&&vl){
      el.addEventListener('input',function(){vl.textContent=el.value+rangeMap[id]});
    }
  });
}

// ============================================================
// 导出
// ============================================================
function downloadPNG(){
  var pv=document.getElementById('previewCanvas');
  var oc=document.createElement('canvas');oc.width=800;oc.height=800;
  var octx=oc.getContext('2d');octx.drawImage(pv,0,0,800,800);
  var a=document.createElement('a');
  a.download='seal_'+Date.now()+'.png';a.href=oc.toDataURL('image/png');a.click();
}

function downloadJPG(){
  var pv=document.getElementById('previewCanvas');
  var tc=document.createElement('canvas');tc.width=800;tc.height=800;
  var tctx=tc.getContext('2d');
  tctx.fillStyle='#ffffff';tctx.fillRect(0,0,800,800);
  tctx.drawImage(pv,0,0,800,800);
  var a=document.createElement('a');
  a.download='seal_'+Date.now()+'.jpg';a.href=tc.toDataURL('image/jpeg',0.92);a.click();
}

// 启动
document.addEventListener('DOMContentLoaded',function(){
  bindEvents();updateUI();render();
});
</script>
</body>
</html>
