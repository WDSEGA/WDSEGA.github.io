  {

    tags:["数字", "递增", "Counter"],
    desc:"数字从0递增到目标值，带缓动效果",
    html:"<div style=\"padding:20px\"><div id=\"counter\" style=\"font-size:48px;font-weight:bold;color:#e94560;font-family:monospace\">0</div><p style=\"margin-top:8px;color:#666;font-size:14px\">\u7f51\u7ad9\u8bbf\u95ee\u91cf</p><button onclick=\"startCount(2026)\" style=\"margin-top:12px;padding:8px 16px;background:#e94560;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px\">\u5f00\u59cb\u8ba1\u6570\u52a8\u753b</button></div>",

    js:"function startCount(target){var el=document.getElementById('counter');var current=0;var step=Math.ceil(target/60);var timer=setInterval(function(){current+=step;if(current>=target){current=target;clearInterval(timer)}el.textContent=current},30)}"

  {

    tags:["复制", "Clipboard", "剪贴板"],
    desc:"点击按钮将文字复制到系统剪贴板",
    html:"<div style=\"padding:20px;max-width:400px\"><input id=\"copyText\" value=\"Hello, Web Component Dictionary!\" style=\"width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:6px;font-size:14px\"><button onclick=\"doCopy()\" style=\"margin-top:10px;width:100%;padding:10px;border:none;border-radius:6px;background:#e94560;color:#fff;cursor:pointer;font-size:14px\">\ud83d\udccb \u590d\u5236\u5230\u526a\u8d34\u677f</button></div>",
    css:"// \u73b0\u4ee3\u6d4f\u89c8\u5668\u5747\u652f\u6301 navigator.clipboard API",
    js:"function doCopy(){var text=document.getElementById('copyText').value;if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){alert('\u2705 \u5df2\u590d\u5236\uff01')}).catch(function(){fallbackCopy(text)})}else{fallbackCopy(text)}function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('\u2705 \u5df2\u590d\u5236\uff01')}"

  {
    id:"u2",
    name:"倒计时器",
    cat:"实用工具",
    tags:["倒计时", "Timer", "Countdown"],
    desc:"设置分钟数开始倒计时，到0时弹出提示",
    html:"<div style=\"padding:20px\"><div style=\"margin-bottom:16px\"><input id=\"cdMin\" type=\"number\" value=\"5\" min=\"1\" max=\"60\" style=\"width:80px;padding:8px;border:1px solid #ddd;border-radius:6px;text-align:center;font-size:16px\"> <span style=\"font-size:14px;color:#666\">\u5206\u949f</span></div><div id=\"cdDisplay\" style=\"font-size:48px;font-weight:bold;color:#e94560;font-family:monospace;margin-bottom:16px\">05:00</div><button onclick=\"startCountdown()\" style=\"padding:10px 20px;background:#e94560;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px\">\u5f00\u59cb\u5012\u8ba1\u65f6</button></div>",
    css:"// \u5012\u8ba1\u65f6\u663e\u793a\u4f7f\u7528monospace\u5b57\u4f53\u4fdd\u6301\u6570\u5b57\u5bf9\u9f50",
    js:"var cdTimer;function startCountdown(){var min=parseInt(document.getElementById('cdMin').value)||5;var totalSec=min*60;clearInterval(cdTimer);cdTimer=setInterval(function(){var m=Math.floor(totalSec/60);var s=totalSec%60;document.getElementById('cdDisplay').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;if(totalSec<=0){clearInterval(cdTimer);alert('\u23f0 \u65f6\u95f4\u5230\uff01')}else{totalSec--},1000)}"

  {
    id:"u3",

    cat:"实用工具",
    tags:["随机", "Random", "生成器"],
    desc:"生成指定范围内的随机整数，适合抽奖、抽签",
    html:"<div style=\"padding:20px;max-width:400px\"><div style=\"display:flex;gap:10px;margin-bottom:12px\"><input id=\"rMin\" value=\"1\" style=\"flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:6px;font-size:14px\"><span style=\"color:#666\">~</span><input id=\"rMax\" value=\"100\" style=\"flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:6px;font-size:14px\"></div><div id=\"rResult\" style=\"font-size:36px;font-weight:bold;color:#e94560;text-align:center;padding:20px 0;margin-bottom:12px;background:#f8f9fa;border-radius:8px\">?</div><button onclick=\"genRandom()\" style=\"width:100%;padding:10px;border:none;border-radius:6px;background:#e94560;color:#fff;cursor:pointer;font-size:14px\">\ud83c\udfb2 \u751f\u6210\u968f\u673a\u6570</button></div>",
    css:"// \u53ef\u6269\u5c55\uff1a\u751f\u6210\u591a\u4e2a\u968f\u673a\u6570\u3001\u4e0d\u91cd\u590d\u968f\u673a\u6570",
    js:"function genRandom(){var min=parseInt(document.getElementById('rMin').value)||1;var max=parseInt(document.getElementById('rMax').value)||100;if(min>max){var t=min;min=max;max=t}var result=Math.floor(Math.random()*(max-min+1))+min;document.getElementById('rResult').textContent=result}"

    html:"<div style=\"padding:20px;max-width:500px\"><textarea id=\"b64Input\" style=\"width:100%;height:80px;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;resize:vertical\" placeholder=\"\u8f93\u5165\u8981\u7f16\u7801/\u89e3\u7801\u7684\u6587\u672c...\"></textarea><div style=\"display:flex;gap:10px;margin-top:10px\"><button onclick=\"b64Encode()\" style=\"flex:1;padding:8px;border:none;border-radius:6px;background:#e94560;color:#fff;cursor:pointer;font-size:13px\">\u7f16\u7801 \u2192</button><button onclick=\"b64Decode()\" style=\"flex:1;padding:8px;border:none;border-radius:6px;background:#0f3460;color:#fff;cursor:pointer;font-size:13px\">\u2190 \u89e3\u7801</button></div><textarea id=\"b64Output\" style=\"width:100%;height:80px;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;resize:vertical;margin-top:10px\" placeholder=\"\u7ed3\u679c...\"></textarea></div>",
    css:"// \u4e2d\u6587\u9700\u7528 btoa(encodeURIComponent(text)) \u5904\u7406",
    js:"function b64Encode(){var text=document.getElementById('b64Input').value;try{var encoded=btoa(encodeURIComponent(text).replace(/%([0-9A-F]{2})/g,function(m,p1){return String.fromCharCode(parseInt(p1,16))}));document.getElementById('b64Output').value=encoded}catch(e){alert('\u7f16\u7801\u5931\u8d25')}}function b64Decode(){var text=document.getElementById('b64Input').value;try{var decoded=decodeURIComponent(Array.from(atob(text)).map(function(c){return '%'+c.charCodeAt(0).toString(16).padStart(2,'0')}).join(''));document.getElementById('b64Output').value=decoded}catch(e){alert('\u89e3\u7801\u5931\u8d25\uff1a\u8bf7\u8f93\u5165\u6709\u6548\u7684Base64\u5b57\u7b26\u4e32')}"

  }
];

var currentComp = null;
var currentTab = 'html';

function renderList(data){
    var list = document.getElementById('list');
    list.innerHTML = '';
    document.getElementById('badge').textContent = '已加载 ' + data.length + ' 个组件';
    data.forEach(function(c, i){
        var d = document.createElement('div');
        d.className = 'cc';
        d.innerHTML = '<h3>' + c.name + '</h3><div class="ct">' + c.cat + '</div><div class="cd">' + c.desc + '</div>';
        d.onclick = function(copy){ return function(){
            currentComp = copy;
            document.querySelectorAll('.cc').forEach(function(x){x.classList.remove('on')});
            d.classList.add('on');
            document.getElementById('es').style.display = 'none';
            document.getElementById('nr').classList.add('s');
            doSwitchTab('html', document.querySelector('.ctb .on'));
        }})(c);
        list.appendChild(d);
    });
}

function doSwitchTab(tab, btn){
    currentTab = tab;
    document.querySelectorAll('.ctb button').forEach(function(b){b.classList.remove('on')});
    btn.classList.add('on');
    updateEditor();
}

function updateEditor(){
    if(!currentComp) return;
    var code = currentComp[currentTab] || '';
    document.getElementById('editor').value = code;
    updatePreview();
}

function updatePreview(){
    if(!currentComp) return;
    var html = currentComp.html || '';
    var css = currentComp.css || '';
    var js = currentComp.js || '';
    var iframe = document.getElementById('iframe');
    var doc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + css + '</style></head><body>' + html + '<script>' + js + '<\/script></body></html>';
    iframe.srcdoc = doc;
}

function doFilter(){
    var q = document.getElementById('search').value.toLowerCase();
    if(!q){ renderList(COMPS); return; }
    var filtered = COMPS.filter(function(c){
        return c.name.toLowerCase().indexOf(q) !== -1 ||
               c.desc.toLowerCase().indexOf(q) !== -1 ||
               c.tags.some(function(t){ return t.toLowerCase().indexOf(q) !== -1 });
    });
    renderList(filtered);
}

function doFilterCat(cat, btn){
    document.querySelectorAll('.cb').forEach(function(b){b.classList.remove('on')});
    btn.classList.add('on');
    if(cat === '全部'){ renderList(COMPS); return; }
    var filtered = COMPS.filter(function(c){ return c.cat === cat });
    renderList(filtered);
}

function doCopy(){
    var editor = document.getElementById('editor');
    editor.select();
    navigator.clipboard.writeText(editor.value).then(function(){
        var btn = document.querySelector('.ph button');
        var old = btn.textContent;
        btn.textContent = '✅ 已复制';
        setTimeout(function(){ btn.textContent = old }, 2000);
    }).catch(function(){
        var textarea = document.createElement('textarea');
        textarea.value = editor.value;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        var btn = document.querySelector('.ph button');
        btn.textContent = '✅ 已复制';
        setTimeout(function(){ btn.textContent = '📋 复制代码' }, 2000);
    });
}

renderList(COMPS);
</script>
</body>
</html>
